# /etc/tv-scheduler.conf  (edit, then nothing else to do; it's re-read on every check)

# --- Presence: "home" = at least one device is connected to the NAS's Wi-Fi extender
# (access point DRARYN_Extension on this interface). Checked with `iw station dump`,
# so phones count even when asleep, as long as they stay on the Wi-Fi.
EXTENDER_IFACE="wlp0s20f3"
# Devices that are always connected and should NOT count as someone being home
# (space-separated MACs, e.g. a smart plug). Empty = everything counts.
EXTENDER_IGNORE_MACS=""
# Seconds with nothing connected before it counts as "away".
# Low = fast, but a short Wi-Fi drop while you're home can turn the TV off.
AWAY_AFTER_SEC=10

# How often to check (seconds). Changing this needs: sudo systemctl restart tv-scheduler
CHECK_EVERY_SEC=5

# --- Sleep schedule (24h, HH:MM)
SCHOOL_NIGHT_OFF="21:30"   # evening before a school day
SCHOOL_MORNING_ON="05:00"  # morning of a school day
FREE_NIGHT_OFF="00:00"     # evening before a free day (00:00 = midnight)
FREE_MORNING_ON="10:00"    # morning of a free day
# School days come from Bakalari (tv-scheduler-bakalari caches them a few times a day).
# Backup when Bakalari has no answer: Mon-Fri (1-5), minus dates in this file (one YYYY-MM-DD per line,
# or a range YYYY-MM-DD..YYYY-MM-DD). Put holidays / prázdniny here.
FREE_DATES_FILE="/etc/tv-scheduler.free-dates"

# --- How to talk to the TV: cec | lgnet | auto (try cec, fall back to lgnet)
TV_BACKEND="lgnet"   # NAS GPU (GeForce 210) has no HDMI-CEC, so auto would always fall back anyway
# Only for lgnet: TV IP + MAC (MAC needed for Wake-on-LAN to turn it on).
# On the TV enable: Settings > General > Devices > "Turn on via Wi-Fi" (or "Mobile TV On").
TV_IP="192.168.88.113"     # LG webOS TV, 2021 (EDID "LG TV SSCR2")
TV_MAC="dc:03:98:84:1b:f4"
# Wake-on-LAN broadcast address of the LAN
WOL_BCAST="192.168.88.255"
