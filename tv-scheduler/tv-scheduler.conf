# /etc/tv-scheduler.conf  (edit, then nothing else to do; it's re-read every minute)

# --- Presence: IPs of devices that mean "Sammy is home" (your phone).
# Give the phone a fixed IP (DHCP reservation in the router) and set
# iPhone Wi-Fi > (i) > Private Wi-Fi Address to "Fixed" (not "Rotating").
PHONE_IPS="192.168.1.50"
# Minutes without seeing the phone before you count as "away".
# iPhones nap their Wi-Fi a lot, so don't set this too low.
AWAY_AFTER_MIN=20

# --- Sleep schedule (24h, HH:MM)
SCHOOL_NIGHT_OFF="21:30"   # evening before a school day
SCHOOL_MORNING_ON="05:00"  # morning of a school day
FREE_NIGHT_OFF="00:00"     # evening before a free day (00:00 = midnight)
FREE_MORNING_ON="10:00"    # morning of a free day
# School days = Mon-Fri (1-5), minus dates in this file (one YYYY-MM-DD per line,
# or a range YYYY-MM-DD..YYYY-MM-DD). Put holidays / prázdniny here.
FREE_DATES_FILE="/etc/tv-scheduler.free-dates"

# --- How to talk to the TV: cec | lgnet | auto (try cec, fall back to lgnet)
TV_BACKEND="auto"
# Only for lgnet: TV IP + MAC (MAC needed for Wake-on-LAN to turn it on).
# On the TV enable: Settings > General > Devices > "Turn on via Wi-Fi" (or "Mobile TV On").
TV_IP="192.168.1.60"
TV_MAC="aa:bb:cc:dd:ee:ff"
